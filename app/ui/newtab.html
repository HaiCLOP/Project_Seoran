<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="stylesheet" href="/seoran.css">
<script src="/icons.js"></script>
<style>
  html, body { min-height: 100%; background: var(--bg); }
  body { min-height: 100vh; overflow-x: hidden; }
  main {
    width: min(640px, calc(100vw - 48px));
    margin: 0 auto;
    padding-top: clamp(64px, 22vh, 200px);
  }
  .mark {
    display: block;
    width: 40px;
    height: 40px;
    margin: 0 auto 24px;
  }
  form {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 48px;
    padding: 0 16px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--line-2);
  }
  form:focus-within { border-color: var(--accent); }
  form .ic { color: var(--ink-3); flex: none; }
  #q {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 15px;
  }
  #q::placeholder { color: var(--ink-3); }

  .sites {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 4px;
    margin-top: 32px;
  }
  .site {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 8px 10px;
    border-radius: 10px;
    color: var(--ink-2);
    text-decoration: none;
    font-size: 12px;
  }
  .site:hover { background: var(--hover); color: var(--ink); }
  .mono {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    font-weight: 600;
    font-size: 15px;
  }
  .site .name {
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .site .forget {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--ink-3);
    visibility: hidden;
  }
  .site:hover .forget { visibility: visible; }
  .site .forget:hover { background: var(--press); color: var(--ink); }
  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    text-align: center;
    color: var(--ink-3);
    font-size: 12px;
  }
  @media (max-width: 520px) { .sites { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<main>
  <img class="mark" src="/logo.svg" alt="">
  <form id="search" autocomplete="off">
    <span id="sic"></span>
    <input id="q" type="text" spellcheck="false" autocomplete="off" placeholder="Search or type an address" aria-label="Search or type an address">
  </form>
  <div id="sites"></div>
</main>
<footer id="stat"></footer>
<script>
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  $('#sic').innerHTML = icon('search', 18);

  function render(d) {
    if (d.theme && d.theme !== 'system') document.documentElement.dataset.theme = d.theme;
    else delete document.documentElement.dataset.theme;
    $('#q').placeholder = d.engine ? `Search with ${d.engine} or type an address` : 'Search or type an address';
    $('#sites').innerHTML = d.topSites.length ? `<div class="sites">${d.topSites.map((s) => {
      const site = s.site || s.url;
      const letter = (site.match(/[\p{L}\p{N}]/u) || ['?'])[0].toUpperCase();
      const name = site.split('.').slice(-2, -1)[0] || site;
      return `<a class="site" href="${esc(s.url)}" title="${esc(s.title || site)}">
        <span class="mono">${esc(letter)}</span>
        <span class="name">${esc(name)}</span>
        <button class="forget" data-site="${esc(site)}" aria-label="Remove ${esc(site)}">${icon('x', 12)}</button>
      </a>`;
    }).join('')}</div>` : '';
    $('#stat').textContent = d.shieldOn && d.blockedTotal
      ? `${d.blockedTotal.toLocaleString()} ads and trackers blocked`
      : '';
  }

  $('#sites').addEventListener('click', (e) => {
    const f = e.target.closest('.forget');
    if (!f) return;
    e.preventDefault();
    seoran.send({ t: 'forgetSite', site: f.dataset.site });
  });

  $('#search').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('#q').value.trim();
    if (q) seoran.send({ t: 'navigate', input: q });
  });

  window.__seoranReceive = (msg) => { if (msg.t === 'data') render(msg.data); };
  if (window.seoran) seoran.send({ t: 'hello' });
</script>
</body>
</html>
