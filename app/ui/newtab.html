<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="stylesheet" href="/seoran.css">
<script src="/icons.js"></script>
<script src="/odometer.js"></script>
<style>
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    overflow: hidden;
    background: var(--page);
    display: grid;
    grid-template-rows: 1fr auto;
  }

  /* The field: a faint dot grid that leans toward the cursor and ripples
     each time the shield blocks something. Drawn on a canvas behind it all. */
  #field { position: fixed; inset: 0; z-index: 0; }

  main {
    position: relative;
    z-index: 1;
    align-self: center;
    width: min(680px, calc(100vw - 48px));
    margin: 0 auto;
    padding-bottom: 6vh;
  }

  .word {
    margin: 0 0 30px;
    font-family: var(--font-display);
    font-size: clamp(64px, 9vw, 112px);
    font-weight: 650;
    font-stretch: 92%;
    letter-spacing: -0.03em;
    line-height: 0.95;
    text-align: center;
    color: var(--ink);
  }
  .word .clip { display: inline-block; overflow: hidden; padding: 0 0.04em 0.06em; }
  .word .clip > span { display: inline-block; }
  .word .dot { color: var(--signal-text); }

  form {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 18px;
    border-radius: 26px;
    background: var(--panel);
    box-shadow: 0 0 0 1px var(--line), 0 6px 20px -12px rgba(0, 0, 0, 0.25);
    transition: box-shadow 0.2s var(--ease);
  }
  form:focus-within { box-shadow: 0 0 0 2px var(--signal), 0 8px 26px -12px rgba(0, 0, 0, 0.3); }
  form .ic { color: var(--ink-3); flex: none; }
  #q {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 15.5px;
  }
  #q::placeholder { color: var(--ink-3); }
  #q:focus-visible { box-shadow: none; }

  .sites {
    display: grid;
    grid-template-columns: repeat(auto-fill, 92px);
    justify-content: center;
    gap: 4px;
    margin-top: 34px;
  }
  .wrap { position: relative; }
  .site {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    padding: 10px 0 8px;
    border-radius: var(--r);
    color: var(--ink);
    text-decoration: none;
    transition: background-color 0.15s var(--ease);
  }
  .site:hover { background: var(--hover); }
  .site:focus-visible { box-shadow: var(--ring); }
  .tile {
    display: grid;
    place-items: center;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--panel);
    box-shadow: 0 0 0 1px var(--line);
    transition: transform 0.35s var(--ease), box-shadow 0.2s var(--ease);
  }
  .site:hover .tile { box-shadow: 0 0 0 1px var(--line-2), 0 6px 14px -8px rgba(0, 0, 0, 0.35); }
  .tile img { width: 24px; height: 24px; }
  .tile .letter { font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--ink-2); }
  .site .name {
    max-width: 84px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 12.5px;
  }
  .forget {
    position: absolute;
    top: 4px;
    right: 6px;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-3);
    opacity: 0;
    transition: opacity 0.15s var(--ease);
  }
  .wrap:hover .forget, .forget:focus-visible { opacity: 1; }
  .forget:hover { background: var(--press); color: var(--ink); }

  /* Footer rail: the shield's count, a live ticker of what it blocked, and
     the customize button, on one hairline. */
  footer {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 24px;
    height: 48px;
    padding: 0 12px 0 24px;
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--page) 88%, transparent);
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .count { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .count .ic { color: var(--signal-text); }
  .count b { color: var(--ink); font-weight: 600; }
  .ticker {
    position: relative;
    overflow: hidden;
    min-width: 0;
    mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .ticker .track {
    display: inline-flex;
    gap: 28px;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-3);
    animation: tick var(--tick, 40s) linear infinite;
  }
  .ticker .track span::before { content: "\2715  "; color: var(--signal-text); opacity: 0.7; }
  .ticker:hover .track { animation-play-state: paused; }
  .ticker.empty { visibility: hidden; }
  @keyframes tick { to { transform: translateX(-50%); } }
  .footer-end { display: flex; align-items: center; gap: 4px; }
  .footer-end a { color: var(--signal-text); text-decoration: none; padding: 0 8px; }
  .footer-end a:hover { text-decoration: underline; text-underline-offset: 2px; }
  .customize {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-2);
    transition: background-color 0.15s var(--ease);
  }
  .customize:hover { background: var(--hover); color: var(--ink); }

  /* One orchestrated entrance on load: the word rises out of its line,
     then search, sites and the rail follow. Content is visible by default
     when motion is reduced. */
  .reveal .word .clip > span { animation: rise 0.7s var(--ease) both; }
  .reveal form { animation: up 0.6s 0.12s var(--ease) both; }
  .reveal .site { animation: up 0.55s var(--ease) both; animation-delay: calc(0.2s + var(--i) * 0.035s); }
  .reveal footer { animation: fade 0.6s 0.35s var(--ease) both; }
  @keyframes rise { from { transform: translateY(105%); } }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .reveal * { animation: none !important; }
    .ticker .track { animation: none; }
  }
  @media (max-width: 720px) { footer { grid-template-columns: auto auto; } .ticker { display: none; } }
</style>
</head>
<body class="reveal">
  <canvas id="field" aria-hidden="true"></canvas>
  <main>
    <h1 class="word"><span class="clip"><span>Seoran<span class="dot">.</span></span></span></h1>
    <form id="search" autocomplete="off" role="search">
      <span id="sic"></span>
      <input id="q" type="search" spellcheck="false" autocomplete="off" placeholder="Search the web" aria-label="Search the web">
    </form>
    <div id="sites"></div>
  </main>
  <footer>
    <div class="count" id="count"><span id="nic"></span><span><b id="blocked">0</b> blocked since you installed Seoran</span></div>
    <div class="ticker" id="ticker" aria-label="Recently blocked"><div class="track" id="track"></div></div>
    <div class="footer-end"><a href="#" id="shield-link">Shield settings</a><button class="customize" id="customize" title="Customize Seoran" aria-label="Customize Seoran"></button></div>
  </footer>
<script>
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('#sic').innerHTML = icon('search', 18);
  $('#nic').innerHTML = icon('shieldCheck', 15);
  $('#customize').innerHTML = icon('settings', 18);
  setTimeout(() => document.body.classList.remove('reveal'), 1400);

  window.__seoranLook = ({ theme, plastic }) => {
    const r = document.documentElement;
    if (theme && theme !== 'system') r.dataset.theme = theme; else delete r.dataset.theme;
    if (plastic && plastic !== 'blue') r.dataset.signal = plastic; else delete r.dataset.signal;
    field.colors();
  };

  // ---- the field ------------------------------------------------------------
  const field = (() => {
    const cv = $('#field');
    const ctx = cv.getContext('2d');
    const STEP = 26;
    let W = 0, H = 0, dpr = 1, dots = [], ink = '#000', accent = '#00f';
    let mx = -1e4, my = -1e4, raf = 0, ripples = [], lastRipple = 0;

    function colors() {
      const cs = getComputedStyle(document.documentElement);
      ink = cs.getPropertyValue('--ink').trim() || '#000';
      accent = cs.getPropertyValue('--signal').trim() || '#00f';
      kick();
    }
    function resize() {
      dpr = devicePixelRatio || 1;
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = `${W}px`; cv.style.height = `${H}px`;
      dots = [];
      const ox = (W % STEP) / 2, oy = (H % STEP) / 2;
      for (let y = oy; y < H; y += STEP) for (let x = ox; x < W; x += STEP) dots.push(x, y);
      kick();
    }
    function frame(t) {
      raf = 0;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ripples = ripples.filter((r) => t - r.t0 < 1800);
      let busy = ripples.length > 0;
      for (let i = 0; i < dots.length; i += 2) {
        const x = dots[i], y = dots[i + 1];
        const dm = Math.hypot(x - mx, y - my);
        let k = Math.max(0, 1 - dm / 140) * 0.75;
        for (const r of ripples) {
          const age = t - r.t0;
          const ring = Math.abs(Math.hypot(x - r.x, y - r.y) - age * 0.5);
          k = Math.max(k, Math.max(0, 1 - ring / 34) * (1 - age / 1800));
        }
        const lit = k > 0.02;
        ctx.globalAlpha = lit ? 0.14 + 0.5 * k : 0.1;
        ctx.fillStyle = lit ? accent : ink;
        const rad = 1 + 1.5 * k;
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (busy && !document.hidden) raf = requestAnimationFrame(frame);
    }
    function kick() { if (!raf) raf = requestAnimationFrame(frame); }
    if (!still) {
      addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY; kick(); }, { passive: true });
      document.addEventListener('pointerleave', () => { mx = my = -1e4; kick(); });
    }
    addEventListener('resize', resize);
    resize();
    colors();
    return {
      colors,
      // A ripple from (x, y): one per blocked request, at most every 250ms.
      ripple(x, y) {
        if (still) return;
        const t = performance.now();
        if (t - lastRipple < 250) return;
        lastRipple = t;
        ripples.push({ x, y, t0: t });
        kick();
      },
    };
  })();

  // Magnetic tiles: the icon leans toward the cursor.
  document.addEventListener('pointermove', (e) => {
    if (still) return;
    const site = e.target.closest && e.target.closest('.site');
    for (const t of document.querySelectorAll('.tile.pull')) if (!site || !site.contains(t)) { t.classList.remove('pull'); t.style.transform = ''; }
    if (!site) return;
    const tile = site.querySelector('.tile');
    const r = tile.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width / 2)) * 0.18;
    const dy = (e.clientY - (r.top + r.height / 2)) * 0.18;
    tile.classList.add('pull');
    tile.style.transform = `translate(${Math.max(-6, Math.min(6, dx))}px, ${Math.max(-6, Math.min(6, dy))}px)`;
  }, { passive: true });

  // ---- data ------------------------------------------------------------------
  function face(s, site) {
    const letter = esc((site.match(/[\p{L}\p{N}]/u) || ['?'])[0].toUpperCase());
    let origin = '';
    try { origin = new URL(s.url).origin; } catch {}
    const src = s.favicon || (origin ? `${origin}/favicon.ico` : '');
    return src
      ? `<img src="${esc(src)}" alt="" onerror="this.outerHTML='<span class=letter>${letter}</span>'">`
      : `<span class="letter">${letter}</span>`;
  }

  function ticker(recent) {
    const list = (recent || []).slice(0, 16);
    $('#ticker').classList.toggle('empty', !list.length);
    if (!list.length) return;
    const items = list.map((h) => `<span>${esc(h)}</span>`).join('');
    const track = $('#track');
    const key = list.join(',');
    if (track.dataset.key === key) return;
    track.dataset.key = key;
    track.innerHTML = items + items; // doubled so the loop is seamless
    track.style.setProperty('--tick', `${Math.max(24, list.length * 5)}s`);
  }

  let total = null;
  function setTotal(n) {
    if (total !== null && n > total) {
      const r = $('#nic').getBoundingClientRect();
      field.ripple(r.left + r.width / 2, r.top + r.height / 2);
    }
    total = n;
    odometer($('#blocked'), n);
  }

  function render(d) {
    __seoranLook(d);
    setTotal(d.blockedTotal || 0);
    $('#count').hidden = !d.shieldOn;
    ticker(d.recent);
    $('#q').placeholder = d.engine ? `Search ${d.engine} or type a web address` : 'Search the web';
    $('#sites').innerHTML = d.topSites.length ? `<div class="sites">${d.topSites.slice(0, 8).map((s, i) => {
      const site = s.site || s.url;
      const name = site.replace(/\.(com|org|net|io|co|xyz|in)$/, '');
      return `<div class="wrap">
        <a class="site" href="${esc(s.url)}" title="${esc(s.title || site)}" style="--i:${i}"><span class="tile">${face(s, site)}</span><span class="name">${esc(name)}</span></a>
        <button class="forget" data-site="${esc(site)}" aria-label="Remove ${esc(site)}">${icon('x', 12)}</button>
      </div>`;
    }).join('')}</div>` : '';
  }

  $('#sites').addEventListener('click', (e) => {
    const f = e.target.closest('.forget');
    if (f) seoran.send({ t: 'forgetSite', site: f.dataset.site });
  });
  $('#search').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('#q').value.trim();
    if (q) seoran.send({ t: 'navigate', input: q });
  });
  const openSettings = (e) => { if (e) e.preventDefault(); seoran.send({ t: 'navigate', input: 'seoran://settings' }); };
  $('#customize').addEventListener('click', () => openSettings());
  $('#shield-link').addEventListener('click', openSettings);

  window.__seoranReceive = (msg) => {
    if (msg.t === 'data') render(msg.data);
    if (msg.t === 'total') { setTotal(msg.n); ticker(msg.recent); }
  };
  if (window.seoran) seoran.send({ t: 'hello' });
</script>
</body>
</html>
