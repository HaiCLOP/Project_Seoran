<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="stylesheet" href="/seoran.css">
<script src="/icons.js"></script>
<script src="/odometer.js"></script>
<style>
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    overflow: hidden;
    background: var(--page);
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* top-right: the two ways out of this page */
  .top {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 16px 20px 0;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 32px;
    padding: 0 14px;
    border: 1.5px solid var(--line-2);
    border-radius: 16px;
    background: transparent;
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.15s var(--ease), color 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .pill:hover { background: var(--ink); border-color: var(--ink); color: var(--page); }

  main {
    align-self: center;
    width: min(960px, calc(100vw - 64px));
    margin: 0 auto;
    padding-bottom: 4vh;
  }

  /* The wordmark, printed twice: ink on top, the accent ink offset beneath. */
  .word {
    margin: 0 0 28px -0.04em;
    font-family: var(--font-display);
    font-size: clamp(84px, 11vw, 156px);
    font-weight: 800;
    font-stretch: 92%;
    letter-spacing: -0.015em;
    line-height: 0.86;
    color: var(--ink);
    text-shadow: 0.04em 0.04em 0 var(--signal);
  }
  .word .clip { display: inline-block; overflow: hidden; padding: 0 0.08em 0.1em 0; }
  .word .clip > span { display: inline-block; }

  /* The search bar is the one inverted surface: chalk at night, ink on paper. */
  form {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 60px;
    padding: 0 22px;
    border-radius: 30px;
    background: var(--ink);
    color: var(--page);
    box-shadow: 5px 5px 0 var(--signal);
    transition: box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
  }
  form:focus-within { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--signal); }
  form .ic { flex: none; opacity: 0.75; }
  #q {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--page);
    caret-color: var(--page);
    font-size: 17px;
    font-weight: 500;
  }
  #q::placeholder { color: color-mix(in srgb, var(--page) 62%, var(--ink)); }
  #q:focus-visible { box-shadow: none; }
  #q::selection { background: var(--signal); color: var(--on-pop); }

  /* Top sites: solid blocks of ink, each its own colour. */
  .sites {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-top: 40px;
  }
  .wrap { position: relative; }
  .site {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 112px;
    padding: 14px 16px 14px;
    border-radius: 16px;
    background: var(--pop);
    color: var(--on-pop);
    text-decoration: none;
    transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease);
  }
  .site:hover { transform: translate(-3px, -3px); box-shadow: 4px 4px 0 var(--ink); }
  .site:active { transform: none; box-shadow: 0 0 0 var(--ink); transition-duration: 0.06s; }
  .site:focus-visible { box-shadow: 0 0 0 3px var(--page), 0 0 0 5px var(--ink); }
  .face {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #fffaf2;
  }
  .face img { width: 22px; height: 22px; }
  .face .letter { font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--on-pop); }
  .site .name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 750;
    font-stretch: 90%;
    letter-spacing: -0.015em;
  }
  .forget {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: var(--on-pop);
    color: #fffaf2;
    opacity: 0;
    transition: opacity 0.15s var(--ease), transform 0.18s var(--ease);
  }
  .wrap:hover .forget, .forget:focus-visible { opacity: 1; }
  .wrap:hover .forget { transform: translate(-3px, -3px); }
  .empty-sites { margin-top: 36px; color: var(--ink-2); font-size: 14px; }

  /* The band: what the shield has done, scrolling past in the accent ink. */
  .band {
    position: relative;
    display: flex;
    align-items: center;
    height: 64px;
    overflow: hidden;
    background: var(--signal);
    color: var(--on-pop);
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 800;
    font-stretch: 88%;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .band.off { background: var(--panel-2); color: var(--ink-2); }
  .band .track {
    display: inline-flex;
    align-items: center;
    gap: 0;
    padding-left: 28px;
    animation: tick var(--tick, 40s) linear infinite;
  }
  .band.still .track { animation: none; }
  .band:hover .track { animation-play-state: paused; }
  .band .item { padding-right: 22px; }
  .band .item.host { font-weight: 650; }
  .band .slash { padding-right: 22px; opacity: 0.55; }
  .band .total { display: inline-flex; align-items: center; gap: 12px; }
  .band .total .roll { font-weight: 800; }
  .band .total.bump .roll { animation: bump 0.32s var(--ease); }
  @keyframes bump { 40% { transform: scale(1.18); } }
  @keyframes tick { to { transform: translateX(-50%); } }

  /* One entrance on load: the word rises out of its line, the rest follows. */
  .reveal .word .clip > span { animation: rise 0.75s var(--ease) both; }
  .reveal form { animation: up 0.6s 0.14s var(--ease) both; }
  .reveal .wrap { animation: up 0.55s var(--ease) both; animation-delay: calc(0.22s + var(--i) * 0.04s); }
  .reveal .band { animation: band 0.6s 0.3s var(--ease) both; }
  @keyframes rise { from { transform: translateY(105%); } }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  @keyframes band { from { transform: translateY(100%); } }
  @media (prefers-reduced-motion: reduce) {
    .reveal * { animation: none !important; }
    .band .track { animation: none; }
  }
  @media (max-width: 760px) { .sites { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body class="reveal">
  <div class="top">
    <a class="pill" href="#" id="shield-link"><span id="shic"></span>Shield</a>
    <a class="pill" href="#" id="customize"><span id="cuic"></span>Customize</a>
  </div>
  <main>
    <h1 class="word"><span class="clip"><span>Seoran</span></span></h1>
    <form id="search" autocomplete="off" role="search">
      <span id="sic" class="ic"></span>
      <input id="q" type="search" spellcheck="false" autocomplete="off" placeholder="Search the web" aria-label="Search the web">
    </form>
    <div id="sites"></div>
  </main>
  <div class="band still" id="band" role="status" aria-live="off"><div class="track" id="track"></div></div>
<script>
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const POPS = ['volt', 'hot', 'sky', 'tang', 'lilac', 'mint'];
  $('#sic').innerHTML = icon('search', 20);
  $('#shic').innerHTML = icon('shieldCheck', 15);
  $('#cuic').innerHTML = icon('settings', 15);
  setTimeout(() => document.body.classList.remove('reveal'), 1400);

  window.__seoranLook = ({ theme, plastic }) => {
    const r = document.documentElement;
    if (theme && theme !== 'system') r.dataset.theme = theme; else delete r.dataset.theme;
    if (plastic && plastic !== 'volt') r.dataset.signal = plastic; else delete r.dataset.signal;
  };

  // ---- top sites ------------------------------------------------------------
  function face(s, site) {
    const letter = esc((site.match(/[\p{L}\p{N}]/u) || ['?'])[0].toUpperCase());
    let origin = '';
    try { origin = new URL(s.url).origin; } catch {}
    const src = s.favicon || (origin ? `${origin}/favicon.ico` : '');
    return src
      ? `<img src="${esc(src)}" alt="" onerror="this.outerHTML='<span class=letter>${letter}</span>'">`
      : `<span class="letter">${letter}</span>`;
  }

  // ---- the band ---------------------------------------------------------------
  let state = { total: null, recent: [], on: true };
  function band() {
    const b = $('#band');
    const track = $('#track');
    b.classList.toggle('off', !state.on);
    if (!state.on) {
      b.classList.add('still');
      track.dataset.key = 'off';
      track.innerHTML = '<span class="item">Shield is off. Ads and trackers load normally.</span>';
      return;
    }
    const hosts = [...new Set((state.recent || []).map((h) => h.replace(/^www\./, '')))].slice(0, 14);
    const key = hosts.join(',');
    if (track.dataset.key === key && track.querySelector('.total')) return;
    track.dataset.key = key;
    const head = '<span class="item total"><span class="n"></span><span>blocked since you installed Seoran</span></span>';
    const run = hosts.map((h) => `<span class="slash">/</span><span class="item host">${esc(h)}</span>`).join('');
    // Doubled so the loop is seamless; only scroll when there is something to show.
    track.innerHTML = hosts.length ? `${head}${run}<span class="slash">/</span>${head}${run}<span class="slash">/</span>` : head;
    b.classList.toggle('still', !hosts.length);
    track.style.setProperty('--tick', `${Math.max(26, hosts.length * 5)}s`);
    for (const n of track.querySelectorAll('.n')) odometer(n, state.total || 0);
  }

  function setTotal(n, recent) {
    const grew = state.total !== null && n > state.total;
    state.total = n;
    if (recent) state.recent = recent;
    band();
    for (const el of document.querySelectorAll('#track .n')) odometer(el, n);
    if (grew) {
      for (const t of document.querySelectorAll('#track .total')) {
        t.classList.remove('bump');
        void t.offsetWidth;
        t.classList.add('bump');
      }
    }
  }

  function render(d) {
    __seoranLook(d);
    state.on = !!d.shieldOn;
    setTotal(d.blockedTotal || 0, d.recent || []);
    $('#q').placeholder = d.engine ? `Search ${d.engine} or type a web address` : 'Search the web';
    $('#sites').innerHTML = d.topSites.length ? `<div class="sites">${d.topSites.slice(0, 8).map((s, i) => {
      const site = s.site || s.url;
      const name = site.replace(/\.(com|org|net|io|co|xyz|in)$/, '');
      return `<div class="wrap ink-${POPS[i % POPS.length]}" style="--i:${i}">
        <a class="site" href="${esc(s.url)}" title="${esc(s.title || site)}"><span class="face">${face(s, site)}</span><span class="name">${esc(name)}</span></a>
        <button class="forget" data-site="${esc(site)}" aria-label="Remove ${esc(site)}">${icon('x', 13)}</button>
      </div>`;
    }).join('')}</div>` : '<p class="empty-sites">Sites you visit often will show up here.</p>';
  }

  $('#sites').addEventListener('click', (e) => {
    const f = e.target.closest('.forget');
    if (f) seoran.send({ t: 'forgetSite', site: f.dataset.site });
  });
  $('#search').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('#q').value.trim();
    if (q) seoran.send({ t: 'navigate', input: q });
  });
  const openSettings = (e) => { if (e) e.preventDefault(); seoran.send({ t: 'navigate', input: 'seoran://settings' }); };
  $('#customize').addEventListener('click', openSettings);
  $('#shield-link').addEventListener('click', openSettings);

  window.__seoranReceive = (msg) => {
    if (msg.t === 'data') render(msg.data);
    if (msg.t === 'total') setTotal(msg.n, msg.recent);
  };
  if (window.seoran) seoran.send({ t: 'hello' });
</script>
</body>
</html>
